<style>

</style></head><body>
<div id="bar">
<button class="p" id="play">Pausa</button><button id="rst">Reiniciar</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const G=9.79,TH=35*Math.PI/180,H=0.30,L=H/Math.sin(TH),MK={50:0.109,250:0.216},MC=0.5,W=0.10,ST=0.01;
const CL=0.165,CW=0.08,DT=0.002;
const st={m:0.05,R:0.30,sp:1,t:0,play:true,mu:0.003,Lf:0.25,L1:0.20,hd:0.05,zd:0.19,zu:0.19,auto:true,hu:0.05,ex:15};
let P={},dynG=null;
const el=i=>document.getElementById(i);
const D=L+0.0375,E={x:D*Math.cos(TH),y:1.0-D*Math.sin(TH)};
const PS={x:E.x+0.02*Math.sin(TH),y:E.y+0.02*Math.cos(TH)};
const XS=E.x+0.005,XE=XS+0.175,XC0=XS+0.0875,LS=XE-XC0,YF=E.y-0.09;
function run(hu,d0){const AD=Math.atan2(st.hd,st.zd),AU=Math.atan2(hu,st.zu),L1=st.L1,q2=L1+Math.hypot(st.hd,st.zd),q3=q2+Math.hypot(hu,st.zu),uw=d0+q3+st.Lf-CL/2-0.01;
 const U=new Float32Array(40001);let u=d0,v=P.v2,i=0;
 const sl=q=>q<L1?0:q<q2?-AD:q<q3?AU:0;
 for(i=0;i<40000;i++){U[i]=u;const th=sl(u-d0),ag=-G*Math.sin(th),fr=st.mu*G*Math.cos(th);
  if(Math.abs(v)<1e-5){if(Math.abs(ag)<=fr)break;v=ag*DT;}
  else{const a=ag-Math.sign(v)*fr,w=v+a*DT;v=w*v<0?0:w;}
  u+=v*DT;if(u>=uw){u=uw;break;}if(u<d0){u=d0;v=0;}}
 U[i]=u;return{U,n:i+1,u,wall:u>=uw-1e-9,sf:u-(d0+q3)};}
function physics(){
 const mk=MK[Math.round(st.m*1000)];
 const a1=G*(Math.sin(TH)-mk*Math.cos(TH)),v1=Math.sqrt(2*a1*L),t1=v1/a1;
 const vy0=v1*Math.sin(TH),vx=v1*Math.cos(TH),drop=PS.y-(YF+0.06);
 const tf=(-vy0+Math.sqrt(vy0*vy0+2*G*drop))/G;
 const v2=st.m*vx/(st.m+MC),phi=Math.atan(v2*v2/(st.R*G)),tl=t1+tf;
 const R=st.R,need=Math.hypot(R+CW/2,CL/2),wo=Math.max(W/2,need+0.005-R),d0=LS+Math.PI*R/2;
 P={mk,a1,v1,t1,vy0,vx,tf,v2,phi,tl,wo,need,d0,offx:PS.x+vx*tf-XC0};
 m2.position.x=P.offx;
 let hu=st.hu;
 if(st.auto){const tg=Math.max(0.01,Math.min(0.5*st.Lf,st.Lf-CL/2-0.012));let lo=0,hi=0.3;
  for(let k=0;k<28;k++){const m=(lo+hi)/2;(run(m,d0).sf>tg?lo=m:hi=m);}hu=(lo+hi)/2;el('hs').value=hu;}
 st.hu=hu;el('hv').textContent=(hu*100).toFixed(1)+' cm';
 const r=run(hu,d0);P.r=r;P.tc=d0/v2;P.tend=tl+P.tc+r.n*DT;
 const L1=st.L1,HD=st.hd,Ld=Math.hypot(st.hd,st.zd),Lu=Math.hypot(hu,st.zu),q2=L1+Ld,q3=q2+Lu,z1=L1,z2=z1+st.zd,z3=z2+st.zu;
 P.B=[{q:0,z:0,y:0},{q:L1,z:z1,y:0},{q:q2,z:z2,y:-HD},{q:q3,z:z3,y:-HD+hu},{q:q3+st.Lf,z:z3+st.Lf,y:-HD+hu}];
 const ap=0.047,bb=CW/2,Rmin=((CL/2)**2+bb*bb-ap*ap)/(2*(ap-bb));
 const res=r.wall?`llega al tope (sobra energía)`:r.sf>=0?`<b>se detiene a ${(r.sf*100).toFixed(1)} cm</b> del inicio del plano final`:`no logra pasar la subida`;
 el('inf').innerHTML=`<b>Dimensiones</b><br>Curva: 2 tijeras laterales (eje x) + 2 varillas largas en rectángulo. Listones de tijeras: rampa 50 cm, demás 30 cm. Rampa sobre marco triangular de madera: hipotenusa ${(L*100).toFixed(1)} cm, altura 30 cm, base ${(L*Math.cos(TH)*100).toFixed(1)} cm (35°); inicia a 1.00 m<br>Segmento: 10 × 17.5 × 4.5 cm · Carrito: 8 × 16.5 × 4 cm · Maleta: 4.8 × 7.5 × 4 cm<br><br><b>Curva 90°</b>, R = ${R.toFixed(2)} m<br>Con vía de 10 cm el carrito exige R ≥ ${Rmin.toFixed(2)} m. Con R = ${R.toFixed(2)} m la vía se ensancha ${((wo-W/2)*1000).toFixed(1)} mm por fuera (ancho total ${((W/2+wo)*100).toFixed(1)} cm); holgura exterior 5 mm.<br><br><b>Tramo final</b><br>Recto ${(L1*100).toFixed(0)} cm → bajada: ${(HD*100).toFixed(1)} cm de altura en ${(st.zd*100).toFixed(0)} cm (${(Math.atan2(HD,st.zd)*57.296).toFixed(1)}°) → subida: ${(hu*100).toFixed(1)} cm en ${(st.zu*100).toFixed(0)} cm (${(Math.atan2(hu,st.zu)*57.296).toFixed(1)}°) → plano ${(st.Lf*100).toFixed(0)} cm (mín. 10) con tope.<br>Carrito ${r.wall||r.sf<0?'':''}${res}.<br><br><b>Modelo (maleta ${Math.round(st.m*1000)} g, μk = ${mk})</b><br>v′ = ${v2.toFixed(3)} m/s · peralte teórico ${(phi*180/Math.PI).toFixed(2)}° (visual ${st.ex}×)<br>En la curva v es constante; después aplican aceleración por pendiente y fricción μ (ajustable).`;
}
const cv=el('c'),wrap=el('wrap');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,0.01,50);
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
scene.background=new THREE.Color(dark?0x101722:0xe9edf3);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,0.85));
const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(1.5,3,2);scene.add(dl);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:.1},o));
const mCar=mat(0xb98a55),mSteel=mat(0x7d8794,{metalness:.6,roughness:.4}),mTrk=mat(0x4a5568),mWall=mat(0x6b7788,{side:THREE.DoubleSide}),mWood=mat(0xd9b27a,{roughness:.9}),mDk=mat(0x2a2118),mGold=mat(0xd9a441);
const box=(w,h,d,m,x,y,z,par)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(par||scene).add(o);return o;};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
scene.add(new THREE.GridHelper(4,40,0x889,0xaab));
box(1.6,0.01,3.4,mat(0xcfd6e0),0.6,-0.005,-1.2);
function bar(a,b,r,m,par){const d=new THREE.Vector3().subVectors(b,a),n=d.length();const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,n,8),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());(par||scene).add(o);}
// listón plano de la tijera: a→b en el plano de la tijera, t = normal al plano
function slat(a,b,t,off,par){const d=new THREE.Vector3().subVectors(b,a),n=d.length(),y=d.clone().normalize(),z=new THREE.Vector3().crossVectors(t,y);
 const o=new THREE.Mesh(new THREE.BoxGeometry(0.006,n,0.018),mWood);o.position.copy(a).addScaledVector(d,.5).addScaledVector(t,off);
 o.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(t,y,z));par.add(o);}
// tijera real a cada costado del módulo: listones en X con tornillo en cada cruce + palo superior con riel (ranura) y agujero
function scissor(cx,cz,dx,dz,top,par,n,l){const t=V(dz,0,-dx),up=V(0,1,0),dv=V(dx,0,dz);
 // listones de largo fijo l: la altura la dan los niveles de cruces; el ancho sale de l² = ancho² + altura² (sin pasar del largo del módulo n)
 const wf=k=>{const h=top/k;return h<l?Math.sqrt(l*l-h*h):1e9};let N=Math.max(2,Math.ceil(top/(l*0.98)));while(N<12&&wf(N+1)<=n&&top/(N+1)>=0.12)N++;
 const hm=top/N,hw=wf(N)/2;
 for(let i=0;i<N;i++){const y=i*hm,A=V(cx-dx*hw,y,cz-dz*hw),B=V(cx+dx*hw,y,cz+dz*hw),A2=V(A.x,y+hm,A.z),B2=V(B.x,y+hm,B.z);
  slat(A,B2,t,0.004,par);slat(B,A2,t,-0.004,par);
  const s=new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.005,0.02,8),mGold);s.position.set(cx,y+hm/2,cz);s.quaternion.setFromUnitVectors(up,t);par.add(s);}
 const hl=hw+0.015,mk=(w,h,l,m,off,y)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),m);o.position.set(cx+dx*off,y,cz+dz*off);o.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(t,up,dv));par.add(o);};
 mk(0.018,0.006,2*hl,mWood,0,top);mk(0.008,0.0008,0.04,mDk,hw-0.015,top+0.0034);mk(0.018,0.006,2*hl,mWood,0,0.003);
 const h=new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.005,0.0008,12),mDk);h.position.set(cx-dx*hw,top+0.0034,cz-dz*hw);par.add(h);return{hw,N};}
// módulo: 2 tijeras laterales (costados, donde van las paredes) + varillas transversales al inicio y fin donde reposa el segmento
// fa/fb(l): punto de la parte inferior de la vía al inicio/fin, a lateral l. Si los extremos tienen distinta altura → marco triangular de madera.
function mod(fa,fb,l=0.3){const ys=f=>Math.min(f(-0.06).y,f(0.06).y),ya=ys(fa),yb=ys(fb),yt=Math.min(ya,yb)-0.015;
 const E2={};
 [-1,1].forEach(s=>{const a=fa(s*0.06),b=fb(s*0.06),n=Math.hypot(b.x-a.x,b.z-a.z),dx=(b.x-a.x)/n,dz=(b.z-a.z)/n;
  const r=scissor((a.x+b.x)/2,(a.z+b.z)/2,dx,dz,yt,dynG,n,l),cx=(a.x+b.x)/2,cz=(a.z+b.z)/2;E2[s]=[V(cx-dx*r.hw,yt,cz-dz*r.hw),V(cx+dx*r.hw,yt,cz+dz*r.hw)];
  if(Math.abs(ya-yb)>0.02){const hi=ya>yb,P0=V(a.x,yt+0.015,a.z),P1=V(b.x,yt+0.015,b.z),T=hi?V(a.x,ya-0.009,a.z):V(b.x,yb-0.009,b.z);
   bar(P0,P1,0.009,mWood,dynG);bar(hi?P0:P1,T,0.009,mWood,dynG);bar(hi?P1:P0,T,0.009,mWood,dynG);}});
 [0,1].forEach(k=>{const p=E2[-1][k],q=E2[1][k],e=new THREE.Vector3().subVectors(q,p).normalize().multiplyScalar(0.015);bar(p.clone().sub(e),q.clone().add(e),0.006,mSteel,dynG);});}
// rampa
const ramp=new THREE.Group();ramp.position.set(0,1.0,0);ramp.rotation.z=-TH;scene.add(ramp);
box(D,0.01,W,mCar,D/2,-0.005,0,ramp);
[-1,1].forEach(s=>box(D,0.03,0.008,mCar,D/2,0.015,s*(W/2+0.004),ramp));
const underY=x=>1.0-x*Math.tan(TH)-0.012,ez=V(0,0,1);
// segmento receptor
const yr=YF-ST-0.012;
box(0.175,ST,W,mTrk,XS+0.0875,YF-ST/2,0);
[-1,1].forEach(s=>box(0.175,0.045,0.008,mWall,XS+0.0875,YF+0.0225,s*(W/2+0.004)));
// carrito y maletas
const cartG=new THREE.Group(),inner=new THREE.Group();cartG.rotation.order='YZX';cartG.add(inner);scene.add(cartG);
box(0.165,0.04,0.08,mat(0x1f6f5c),0,0.02,0,inner);box(0.02,0.042,0.082,mat(0xc6e03a),0.07,0.021,0,inner);
const mMal=mat(0xe05a2b);
const m1=box(0.075,0.04,0.048,mMal,0,0,0),m2=box(0.075,0.04,0.048,mMal,0,0.06,0,inner);
cartG.position.set(XC0,YF,0);
const bank=a=>{const x=Math.min(1,a/0.5);return P.phi*st.ex*x*x*(3-2*x);};
function rebuild(){
 if(dynG){scene.remove(dynG);dynG.traverse(o=>o.geometry&&o.geometry.dispose());}
 dynG=new THREE.Group();scene.add(dynG);
 const RB=L*Math.cos(TH);mod(l=>V(0,1.0-0.012,l),l=>V(RB,1.0-H-0.012,l),0.5); // marco triangular 52.3/30/42.8 cm
 mod(l=>V(XS,YF-ST,l),l=>V(XE,YF-ST,l));
 const R=st.R,N=40,wo=P.wo,lo=-ST-0.012,X0=XE+R;
 const pt=(a,lat,h)=>{const b=bank(a),r=R+lat*Math.cos(b);return V(XE+r*Math.sin(a),YF+h*Math.cos(b)+lat*Math.sin(b),-R+r*Math.cos(a));};
 const strip=(l1,h1,l2,h2,m)=>{const p=[],ix=[];for(let i=0;i<=N;i++){const a=Math.PI/2*i/N,A=pt(a,l1,h1),B=pt(a,l2,h2);p.push(A.x,A.y,A.z,B.x,B.y,B.z);if(i<N){const k=2*i;ix.push(k,k+1,k+2,k+1,k+3,k+2);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setIndex(ix);g.computeVertexNormals();dynG.add(new THREE.Mesh(g,m));};
 const ms=mat(0x4a5568,{side:THREE.DoubleSide});
 strip(-W/2,0,wo,0,ms);strip(-W/2,-ST,wo,-ST,ms);strip(wo,0,wo,0.045,mWall);strip(-W/2,0,-W/2,0.045,mWall);
 // curva: 2 tijeras laterales en la dirección del segmento receptor (eje x), unidas por 2 varillas largas que forman un rectángulo que abarca toda la curva
 {const yt=YF-ST-0.03,xa=XE,xb=X0+0.06,n=xb-xa,cxm=(xa+xb)/2,zs=[0.06,-R+0.025];let hw=0;
  zs.forEach(z=>{hw=scissor(cxm,z,1,0,yt,dynG,n,0.3).hw;});
  [-1,1].forEach(k=>{const x=cxm+k*hw;bar(V(x,yt,zs[0]+0.015),V(x,yt,zs[1]-0.015),0.006,mSteel,dynG);});}
 // tramo final: recto → bajada → subida → plano → tope
 const B=P.B;
 for(let i=0;i<4;i++){const a=B[i],b=B[i+1],dz=b.z-a.z,dy=b.y-a.y,l=Math.hypot(dz,dy);
  const g=new THREE.Group();g.position.set(X0,YF+(a.y+b.y)/2-ST/2,-R-(a.z+b.z)/2);g.rotation.x=Math.atan2(dy,dz);dynG.add(g);
  box(W,ST,l,mTrk,0,0,0,g);[-1,1].forEach(s=>box(0.008,0.045,l,mWall,s*(W/2+0.004),ST/2+0.0225,0,g));
  mod(l=>V(X0+l,YF+a.y-ST,-R-a.z),l=>V(X0+l,YF+b.y-ST,-R-b.z));}
 box(W+0.02,0.06,0.01,mat(0xc6e03a),X0,YF+B[4].y+0.03,-R-B[4].z-0.005,dynG);
}
function tailPos(q){const B=P.B;if(q<=0)return{z:q,y:0,ang:0};for(let i=0;i<4;i++){const a=B[i],b=B[i+1];if(q<=b.q){const f=(q-a.q)/(b.q-a.q||1);return{z:a.z+(b.z-a.z)*f,y:a.y+(b.y-a.y)*f,ang:Math.atan2(b.y-a.y,b.z-a.z)};}}const e=B[4];return{z:e.z,y:e.y,ang:0};}
const cam={tx:.5,ty:.5,tz:-.45,r:2.6,az:.55,pol:1.15};
function setCam(){const s=Math.sin(cam.pol);camera.position.set(cam.tx+cam.r*s*Math.sin(cam.az),cam.ty+cam.r*Math.cos(cam.pol),cam.tz+cam.r*s*Math.cos(cam.az));camera.lookAt(cam.tx,cam.ty,cam.tz);}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;cam.az-=(e.clientX-drag.x)*.007;cam.pol=Math.max(.05,Math.min(1.6,cam.pol-(e.clientY-drag.y)*.007));drag={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.r=Math.max(.3,Math.min(6,cam.r*(1+e.deltaY*.001)));},{passive:false});
const VIEWS=()=>[{tx:.5,ty:.5,tz:-.45,r:2.6,az:.55,pol:1.15},{tx:.25,ty:.8,tz:0,r:1.1,az:1.5,pol:1.35},{tx:XE+st.R/2,ty:YF,tz:-st.R/2,r:1.0,az:.3,pol:.5},{tx:XE+st.R,ty:YF-.03,tz:-st.R-.4,r:1.1,az:1.3,pol:1.3}];
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{Object.assign(cam,VIEWS()[+b.dataset.v]);el('fo').checked=false;});
function update(t){
 const p=P;let v=0,ph='',act=null;
 m1.visible=t<p.tl;m2.visible=t>=p.tl;
 if(t<p.t1){const s=0.5*p.a1*t*t+0.0375;m1.position.set(Math.cos(TH)*s+Math.sin(TH)*0.02,1.0-Math.sin(TH)*s+Math.cos(TH)*0.02,0);m1.rotation.z=-TH;v=p.a1*t;ph='1 · Rampa';act=m1.position;}
 else if(t<p.tl){const q=t-p.t1;m1.position.set(PS.x+p.vx*q,PS.y-p.vy0*q-0.5*G*q*q,0);m1.rotation.z=-TH*(1-q/p.tf);v=Math.hypot(p.vx,p.vy0+G*q);ph='2 · Caída y transferencia';act=m1.position;}
 else{const tt=t-p.tl;let u,i,f;if(tt<p.tc){u=p.v2*tt;v=p.v2;}else{f=Math.min((tt-p.tc)/DT,p.r.n-1);i=Math.floor(f);const j=Math.min(i+1,p.r.n-1);u=p.r.U[i]+(p.r.U[j]-p.r.U[i])*(f-i);v=(p.r.U[j]-p.r.U[i])/DT;}
  let a=0,x,z,y=YF,pi=0;
  if(u<=LS){x=XC0+u;z=0;ph='3 · Recepción (segmento recto)';}
  else if(u<=p.d0){a=(u-LS)/st.R;x=XE+st.R*Math.sin(a);z=-st.R+st.R*Math.cos(a);ph='4 · Curva 90° (v constante)';}
  else{const q=u-p.d0,tp=tailPos(q);a=Math.PI/2;x=XE+st.R;z=-st.R-tp.z;y=YF+tp.y;pi=tp.ang;ph=q<P.B[1].q?'5 · Recto':q<P.B[2].q?'6 · Bajada':q<P.B[3].q?'7 · Subida':'8 · Plano final';}
  cartG.position.set(x,y,z);cartG.rotation.set(0,a,pi);inner.rotation.x=-bank(a);
  if(t>=p.tend-DT){ph='Carrito detenido';v=0;}act=cartG.position;}
 el('hud').innerHTML=`<b>t = ${t.toFixed(2)} s</b> / ${p.tend.toFixed(2)} s<br>${ph}<br>v = <b>${Math.abs(v).toFixed(3)} m/s</b>`;
 if(el('fo').checked&&act){cam.tx+=(act.x-cam.tx)*.08;cam.ty+=(act.y-cam.ty)*.08;cam.tz+=(act.z-cam.tz)*.08;}
}
let last=performance.now();
function loop(n){const dt=(n-last)/1000;last=n;
 if(st.play){st.t+=dt*st.sp;if(st.t>P.tend+1.2)st.t=0;}
 update(Math.min(st.t,P.tend));setCam();plots();
 const w=wrap.clientWidth,h=wrap.clientHeight;if(cv.width!==Math.floor(w*devicePixelRatio)||cv.height!==Math.floor(h*devicePixelRatio)){renderer.setPixelRatio(devicePixelRatio);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
 renderer.render(scene,camera);requestAnimationFrame(loop);}

// ---- series v(t), s(t), a(t) y gráficas
let SR={T:[],S:[],V:[],A:[]};
function velAt(t){const p=P;if(t<p.t1)return p.a1*t;if(t<p.tl){const q=t-p.t1;return Math.hypot(p.vx,p.vy0+G*q);}
 const tt=t-p.tl;if(tt<p.tc)return p.v2;if(t>=p.tend-DT)return 0;const f=Math.min((tt-p.tc)/DT,p.r.n-2),i=Math.floor(f);return (p.r.U[i+1]-p.r.U[i])/DT;}
function series(){const p=P,dt=0.02,n=Math.floor(p.tend/dt)+1,T=[],S=[],V=[],A=[];let s=0;
 for(let i=0;i<n;i++){const t=i*dt,v=velAt(t);T.push(t);V.push(v);if(i)s+=(V[i-1]+v)/2*dt;S.push(s);A.push(i?((t-dt<p.tl&&t>=p.tl)?NaN:(v-V[i-1])/dt):p.a1);}
 const rg=k=>{const Y=(k=='S'?S:k=='V'?V:A).filter(isFinite),lo=Math.min(0,...Y),hi=Math.max(1e-6,...Y);return[lo,hi];};
 SR={T,S,V,A,rg:{S:rg('S'),V:rg('V'),A:rg('A')}};lastRow=-1;}
let lastRow=-1;
function drawCh(id,ttl,key,idx){const c=el(id),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;if(!w||!h)return;
 if(c.width!==Math.floor(w*d)||c.height!==Math.floor(h*d)){c.width=Math.floor(w*d);c.height=Math.floor(h*d);}
 const g=c.getContext('2d'),css=getComputedStyle(document.documentElement),fg=css.getPropertyValue('--fg'),mu=css.getPropertyValue('--mu'),ac=css.getPropertyValue('--ac'),bd=css.getPropertyValue('--bd');
 g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);g.font='10px Arial';
 const [lo0,hi0]=SR.rg[key],pd=(hi0-lo0)*0.08||1,lo=lo0-pd,hi=hi0+pd,X0=44,X1=w-8,Y0=h-20,Y1=18,tm=SR.T[SR.T.length-1]||1;
 const px=t=>X0+(X1-X0)*t/tm,py=y=>Y0-(Y0-Y1)*(y-lo)/(hi-lo);
 g.strokeStyle=bd;g.fillStyle=mu;g.lineWidth=1;
 for(let k=0;k<=4;k++){const y=lo+(hi-lo)*k/4;g.beginPath();g.moveTo(X0,py(y));g.lineTo(X1,py(y));g.stroke();g.textAlign='right';g.fillText(y.toFixed(Math.abs(hi-lo)<2?2:1),X0-4,py(y)+3);}
 for(let k=0;k<=4;k++){const t=tm*k/4;g.textAlign='center';g.fillText(t.toFixed(1)+' s',px(t),h-6);}
 g.fillStyle=fg;g.textAlign='left';g.font='bold 11px Arial';g.fillText(ttl,X0,11);
 g.strokeStyle=ac;g.lineWidth=1.8;g.beginPath();let pen=false;
 for(let i=0;i<=idx;i++){const y=SR[key][i];if(!isFinite(y)){pen=false;continue;}pen?g.lineTo(px(SR.T[i]),py(y)):g.moveTo(px(SR.T[i]),py(y));pen=true;}g.stroke();
 const y=SR[key][idx];if(isFinite(y)){g.fillStyle=ac;g.beginPath();g.arc(px(SR.T[idx]),py(y),3.5,0,7);g.fill();}}
function plots(){if(el('gr').style.display==='none')return;const idx=Math.min(SR.T.length-1,Math.floor(st.t/0.02));
 drawCh('gp','Posición recorrida s (m) vs t','S',idx);drawCh('gv','Velocidad v (m/s) vs t','V',idx);drawCh('ga','Aceleración a (m/s²) vs t','A',idx);
 const row=Math.floor(idx/5);if(row!==lastRow){lastRow=row;let h='<table><tr><th>t (s)</th><th>s (m)</th><th>v (m/s)</th><th>a (m/s²)</th></tr>';
  for(let i=0;i<=idx;i+=5)h+=`<tr><td>${SR.T[i].toFixed(2)}</td><td>${SR.S[i].toFixed(3)}</td><td>${SR.V[i].toFixed(3)}</td><td>${isFinite(SR.A[i])?SR.A[i].toFixed(2):'—'}</td></tr>`;
  el('tb').innerHTML=h+'</table>';el('tb').scrollTop=1e9;}}
el('tg').onclick=()=>{const g=el('gr');g.style.display=g.style.display==='none'?'flex':'none';lastRow=-1;};
el('cp').onclick=()=>{const idx=Math.min(SR.T.length-1,Math.floor(st.t/0.02));let c='t_s,s_m,v_mps,a_mps2\n';for(let i=0;i<=idx;i+=5)c+=`${SR.T[i].toFixed(2)},${SR.S[i].toFixed(4)},${SR.V[i].toFixed(4)},${isFinite(SR.A[i])?SR.A[i].toFixed(3):''}\n`;
 try{navigator.clipboard.writeText(c).then(()=>el('cp').textContent='¡Copiado!',()=>el('cp').textContent='No se pudo copiar');}catch(e){el('cp').textContent='No se pudo copiar';}setTimeout(()=>el('cp').textContent='Copiar datos',1800);};
[['l1','L1'],['hd','hd'],['zd','zd'],['zu','zu']].forEach(([i,k])=>el(i).oninput=e=>{st[k]=+e.target.value;el(i+'v').textContent=Math.round(st[k]*100)+' cm';refresh();});
const refresh=()=>{physics();rebuild();series();st.t=0;};
el('play').onclick=()=>{st.play=!st.play;el('play').textContent=st.play?'Pausa':'Reproducir';};
el('rst').onclick=()=>{st.t=0;};
el('mm').onchange=e=>{st.m=e.target.value/1000;refresh();};
el('sp').onchange=e=>st.sp=+e.target.value;
el('rr').oninput=e=>{st.R=+e.target.value;el('rv').textContent=st.R.toFixed(2)+' m';refresh();};
el('mu').oninput=e=>{st.mu=+e.target.value;el('mv').textContent=st.mu.toFixed(4);refresh();};
el('lf').oninput=e=>{st.Lf=+e.target.value;el('lv').textContent=Math.round(st.Lf*100)+' cm';refresh();};
el('au').onchange=e=>{st.auto=e.target.checked;refresh();};
el('hs').oninput=e=>{st.auto=false;el('au').checked=false;st.hu=+e.target.value;refresh();};
refresh();requestAnimationFrame(loop);
</script></body></html>
